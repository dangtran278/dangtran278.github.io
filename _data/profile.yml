short_bio: >-
  <p>
    I study trustworthy machine learning. A model's answer deserves trust only when we can check it against the
    evidence behind it. My research asks when such a check is possible, and what a model should do when it is not.
    I have pursued these questions in vision-language models, information retrieval, causal discovery, and medical
    AI, through interpretability, benchmark design, and closed-form analysis.
  </p>
  <p>
    I earned my M.S. in Computer Science at the University of Massachusetts Amherst in 2026. At Adobe Research,
    I designed <a href="#pub-multattnattrib">MultAttnAttrib</a>, a training-free method that traces a
    vision-language model's answer back to the text and images of a long document. I now work on abstention in
    vision-language models and on causal discovery at UMass Amherst.
  </p>
  <p>
    In three industry internships I built retrieval, OCR and forecasting systems. I am now developing
    <a href="https://github.com/dangtran278/Ctrl-F-ilm" target="_blank">Ctrl F-ilm</a>, a search engine for
    moments in video, deployed on AWS.
  </p>

