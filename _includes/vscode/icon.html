{%- case include.type -%}
{%- when "md" -%}<i class="fi fi-md fa-brands fa-markdown" aria-hidden="true"></i>
{%- when "log" -%}<i class="fi fi-log fa-solid fa-align-left" aria-hidden="true"></i>
{%- when "bib" -%}<i class="fi fi-bib fa-solid fa-book" aria-hidden="true"></i>
{%- when "yaml" -%}<i class="fi fi-yaml fa-solid fa-sliders" aria-hidden="true"></i>
{%- when "json" -%}<i class="fi fi-json fa-solid fa-code" aria-hidden="true"></i>
{%- when "folder" -%}<i class="fi fi-folder fa-solid fa-folder-open" aria-hidden="true"></i>
{%- when "pdf" -%}<i class="fi fi-pdf fa-solid fa-file-pdf" aria-hidden="true"></i>
{%- endcase -%}
